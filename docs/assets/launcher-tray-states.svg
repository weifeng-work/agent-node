<svg width="720" height="520" viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <!-- Title -->
  <text x="20" y="28" font-size="18" font-weight="700" fill="#1a1a2e">托盘图标状态映射 · 2底色 × 联机角标</text>

  <!-- 4 icon states -->
  <g transform="translate(24,52)">
    <!-- Green online -->
    <rect x="0" y="0" width="150" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <circle cx="60" cy="75" r="26" fill="#22c55e"/>
    <rect x="48" y="40" width="24" height="8" rx="4" fill="#3b82f6"/>
    <text x="60" y="130" text-anchor="middle" font-size="12" fill="#166534">🟢 联机开</text>
  </g>

  <g transform="translate(190,52)">
    <rect x="0" y="0" width="150" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <circle cx="60" cy="75" r="26" fill="#22c55e"/>
    <text x="60" y="130" text-anchor="middle" font-size="12" fill="#166534">🟢 联机关</text>
  </g>

  <g transform="translate(356,52)">
    <rect x="0" y="0" width="150" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="60" cy="75" r="26" fill="#ef4444"/>
    <rect x="48" y="40" width="24" height="8" rx="4" fill="#3b82f6"/>
    <text x="60" y="130" text-anchor="middle" font-size="12" fill="#991b1b">🔴 联机开</text>
  </g>

  <g transform="translate(522,52)">
    <rect x="0" y="0" width="150" height="150" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="60" cy="75" r="26" fill="#ef4444"/>
    <text x="60" y="130" text-anchor="middle" font-size="12" fill="#991b1b">🔴 联机关</text>
  </g>

  <!-- Legend -->
  <g transform="translate(24,222)">
    <text y="0" font-size="13" font-weight="600" fill="#1a1a2e">状态定义</text>
    <text y="24" font-size="12" fill="#444"><tspan font-weight="700" fill="#16a34a">绿</tspan> 运行健康 = 心跳新鲜 + alive + 伴生正常</text>
    <text y="44" font-size="12" fill="#444"><tspan font-weight="700" fill="#dc2626">红</tspan> 非健康 = 未运行 / 心跳过期 / 崩溃熔断 / 面板挂 / 组件缺失</text>
    <text y="64" font-size="12" fill="#444"><tspan font-weight="700" fill="#3b82f6">蓝角标</tspan> 联机开（对外放行）｜ 无角标 = 纯本地</text>
  </g>

  <!-- Interaction matrix -->
  <g transform="translate(24,300)">
    <text y="0" font-size="13" font-weight="600" fill="#1a1a2e">交互（左键 / 右键）</text>
    <rect x="0" y="14" width="672" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <g font-size="12" fill="#444">
      <text x="14" y="40"><tspan font-weight="700" fill="#1a1a2e">左键单击</tspan> → 打开 web 面板</text>
      <text x="14" y="64"><tspan font-weight="700" fill="#1a1a2e">右键</tspan> → context 菜单（一切控制）</text>
      <text x="14" y="88"><tspan font-weight="700" fill="#1a1a2e">悬停</tspan> → tooltip 细节</text>
      <text x="14" y="114" fill="#94a3b8">运行中 · 联机 · v0.1.9 · PID 1234 · http://127.0.0.1:5177</text>
      <text x="14" y="138" fill="#991b1b">红态：未运行 / 面板异常 / 组件缺失 / 已熔断停止</text>
      <text x="14" y="160" fill="#64748b" font-size="11">任务执行中不在托盘表达 → 仅 web 面板显示；更新在"检查更新"菜单加徽标</text>
    </g>
  </g>

  <!-- Menu -->
  <g transform="translate(24,468)">
    <text y="0" font-size="13" font-weight="600" fill="#1a1a2e">右键菜单</text>
    <rect x="0" y="14" width="672" height="34" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="14" y="35" font-size="12" fill="#444">打开面板 ｜ ⦿ 联机(via 提权) ｜ 启动　停止　重启 ｜ 检查更新 ｜ 退出控制器(节点驻留)</text>
  </g>
</svg>