<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Bus 控制面板</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --border: #e3e5ea;
    --text: #1c1e24; --muted: #6b7280; --brand: #4b3fe3;
    --green: #1dc981; --gray: #9ca3af;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px;
           background: var(--card); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; margin: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .dot.off { background: var(--gray); }
  #status { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 24px 60px; }
  h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 24px 0 10px; }
  .host-group { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
  .host-header { display: flex; align-items: center; gap: 10px; padding: 8px 14px;
                 background: #eef0f7; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px; }
  .host-header .os-tag { font-size: 11px; padding: 2px 9px; border-radius: 999px; background: var(--brand); color: #fff; font-weight: 600; }
  .host-header .master-tag { font-size: 11px; padding: 2px 9px; border-radius: 999px; background: #ffd800; color: #6b4f00; font-weight: 700; }
  .host-header .node-badge { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px;
          font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); }
  .host-header .node-badge .node-name { font-weight: 600; color: var(--text); }
  .host-header .node-badge .node-state { font-size: 11px; color: var(--muted); }
  .host-header .node-badge.on { border-color: rgba(29,201,129,.4); }
  .host-header .node-badge.off { border-color: var(--border); opacity: .7; }
  .host-header .host-count { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 500; }
  .sys-events { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
  .sys-events summary { cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 13px;
          color: var(--muted); background: #fafbfc; user-select: none; }
  .sys-events summary:hover { color: var(--brand); }
  .sys-events table { border: none; border-radius: 0; }
  .sys-events td, .sys-events th { padding: 6px 12px; font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border);
          border-radius: 999px; padding: 3px 12px; background: var(--card); font-size: 13px;
          white-space: nowrap; max-width: 100%; }
  .chip.offline { opacity: .55; }
  .chip .exe { color: var(--muted); font-size: 11px;
               font-family: "SF Mono", Consolas, monospace; }
  .chip .tag { font-size: 10px; padding: 1px 7px; border-radius: 999px; font-weight: 600; }
  .tag.gui { background: #e7f9f1; color: #0d8f5f; }
  .tag.tui { background: #eef0ff; color: var(--brand); }
  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { background: #fafbfc; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.muted { color: var(--muted); }
  .pill { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 12px; }
  .pill.req { background: #eef0ff; color: var(--brand); }
  .pill.res { background: #e7f9f1; color: #0d8f5f; }
  .pill.reg { background: #f1f2f4; color: var(--muted); }
  .pill.err { background: #fdecea; color: #c53030; }
  .pill.wait { background: #fff7e0; color: #b7791f; }
  .pill.done { background: #e7f9f1; color: #0d8f5f; }
  .preview { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  #refresh { margin-left: 12px; color: var(--muted); font-size: 12px; }
  tr.child td { background: #f2f4fa; }
  tr.child td:first-child { padding-left: 38px; box-shadow: inset 5px 0 0 #4b3fe3; }
  tr.child td:first-child::before { content: "└ "; color: #4b3fe3; font-weight: 700; }
  tr.detail td { background: #f8f9fc; padding: 0; border-bottom: 1px solid var(--border); }
  tr.detail pre { margin: 0; padding: 12px 16px; white-space: pre-wrap; word-break: break-word;
                  font-size: 12px; line-height: 1.7; max-height: 420px; overflow: auto;
                  font-family: "SF Mono", Consolas, "Courier New", monospace; }
  .exp-btn { color: var(--brand); cursor: pointer; font-size: 12px; border: none;
             background: none; padding: 0; margin-left: 10px; white-space: nowrap; }
  .exp-btn:hover { text-decoration: underline; }
  .chip .rm { color: #c53030; cursor: pointer; font-weight: 700; font-size: 13px;
              margin-left: 2px; opacity: .55; }
  .chip .rm:hover { opacity: 1; }
  .chip .edit { color: var(--brand); cursor: pointer; font-size: 12px;
                margin-left: 4px; opacity: .6; text-decoration: none; }
  .chip .edit:hover { opacity: 1; }
</style>
</head>
<body>
<div id="wizard" style="display:none;position:fixed;inset:0;background:rgba(13,17,23,.95);z-index:100;align-items:center;justify-content:center;">
  <div style="max-width:440px;padding:32px;background:#161b22;border:1px solid #30363d;border-radius:12px;">
    <div style="font-size:19px;font-weight:600;color:#e6edf3;margin-bottom:6px;">创建你的队伍</div>
    <div style="font-size:12px;color:#8b949e;margin-bottom:18px;">首次运行。设定队伍名称——局域网内其他设备即可加入本队伍（无口令）。</div>
    <input id="wizTeamName" placeholder="队伍名称（如：Alpha 小队）"
           style="width:100%;padding:10px 12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;box-sizing:border-box;margin-bottom:10px;">
    <div id="wizErr" style="color:#f85149;font-size:12px;margin-top:8px;min-height:16px;"></div>
    <button onclick="doSetup()" style="margin-top:10px;width:100%;padding:10px;background:#238636;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;">创建队伍并开始广播</button>
  </div>
</div>
<header>
  <div class="dot" id="conn"></div>
  <h1>Agent Bus 控制面板</h1>
  <span id="teamBadge" style="display:none;font-size:12px;padding:2px 10px;border-radius:999px;background:#eef0ff;color:var(--brand);font-weight:600;"></span>
  <span id="status">连接中…</span>
</header>
<main>
  <div id="auth-banner" style="display:none"></div>

  <h2>已注册智能体</h2>
  <div id="agents"></div>

  <h2>消息时间线（通信消息）<span id="refresh">每 3 秒自动刷新 · 心跳/注册等系统事件折叠在下方</span></h2>
  <table>
    <thead><tr><th style="width:170px">时间</th><th style="width:80px">类型</th>
      <th style="width:130px">发送方</th><th style="width:130px">接收方</th><th>内容摘要</th></tr></thead>
    <tbody id="messages"></tbody>
  </table>

  <details id="sysEvents" class="sys-events" style="margin:10px 0;">
    <summary class="sys-events-summary">系统事件 <span id="sysEventCount" class="muted"></span></summary>
    <table class="sys-events-table">
      <tbody id="sysEventRows"></tbody>
    </table>
  </details>

  <h2>文件（Claim-Check）</h2>
  <table>
    <thead><tr><th>文件名</th><th style="width:90px">大小</th><th style="width:120px">上传者</th>
      <th style="width:150px">时间</th><th style="width:110px">ID</th></tr></thead>
    <tbody id="files"></tbody>
  </table>
</main>
<script>
const fmt = ts => new Date(ts * 1000).toLocaleString("zh-CN", { hour12: false });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const expanded = new Set();

function summarize(m) {
  const p = m._p;
  if (p.type === "task_request") return (p.payload?.instruction || "").slice(0, 80);
  if (p.type === "task_result") return `[${p.status}] ${(p.result?.output_text || p.error || "").slice(0, 80)}`;
  if (p.type === "register") return `${p.name || p.agent_id || ""} 注册 · 能力: ${(p.capabilities || []).join(", ") || "-"}`;
  if (p.type === "offline") return `${p.agent_id || ""} 节点离线`;
  if (p.type === "task_progress") return `${p.phase || "running"} · ${(p.result?.output_text || "").slice(0, 60)}`;
  return "-";
}

function detailText(m) {
  const p = m._p;
  if (p.type === "task_request") {
    let s = `【任务指令】\n${p.payload?.instruction || "-"}`;
    if (p.payload?.context_data) s += `\n\n【附加上下文】\n${typeof p.payload.context_data === "string" ? p.payload.context_data : JSON.stringify(p.payload.context_data, null, 2)}`;
    if (p.payload?.attachment_urls?.length) s += `\n\n【附件】\n${p.payload.attachment_urls.join("\n")}`;
    if (p.payload?.session_id) s += `\n\n【延续会话】${p.payload.session_id}`;
    s += `\n\n【任务编号】${p.correlation_id}\n【超时】${p.timeout_seconds}s`;
    return s;
  }
  if (p.type === "task_result") {
    let s = `【状态】${p.status}`;
    if (p.result?.output_text) s += `\n\n【执行结果】\n${p.result.output_text}`;
    if (p.error) s += `\n\n【错误】\n${p.error}`;
    if (p.result?.session_id) s += `\n\n【会话 ID】${p.result.session_id}`;
    if (p.result?.artifacts?.length) s += `\n\n【产物】\n${p.result.artifacts.join("\n")}`;
    s += `\n\n【任务编号】${p.correlation_id}`;
    return s;
  }
  if (p.type === "register") {
    return `【名称】${p.name}\n【能力】${(p.capabilities || []).join(", ") || "-"}\n【平台】${p.platform} · ${p.executor || "sdk"}`;
  }
  return JSON.stringify(p, null, 2);
}

function msgRow(m, child = false, mark = "") {
  const p = m._p;
  const st = p.type === "task_result"
    ? (p.status === "success" ? "res" : "err")
    : (p.type === "task_request" ? "req" : "reg");
  const label = p.type === "task_request" ? "任务"
    : p.type === "task_result" ? (p.status === "success" ? "结果" : p.status)
    : (p.type === "register" ? "注册" : p.type);
  const isOpen = expanded.has(m.id);
  const recv = m.target_id || (p.type === "task_result" ? "?" : "-");
  return `<tr class="${child ? "child" : ""}">
      <td class="muted">${fmt(m.ts)}</td>
      <td style="white-space:nowrap"><span class="pill ${st}">${esc(label)}</span></td>
      <td>${esc(m.sender_id)}</td><td class="muted">${esc(recv)}</td>
      <td>${mark}<span class="preview">${esc(summarize(m))}</span><button class="exp-btn" data-id="${m.id}">${isOpen ? "收起 ▴" : "展开 ▾"}</button></td>
    </tr>` +
    (isOpen ? `<tr class="detail" id="detail-${m.id}"><td colspan="5"><pre>${esc(detailText(m))}</pre></td></tr>` : "");
}

// 系统事件类型：不构成"真实通信"，折叠展示不进主消息时间线
const SYSTEM_EVENT_TYPES = new Set(["register", "offline", "task_progress", "error", "sys"]);
const isCommMsg = m => m._p && !SYSTEM_EVENT_TYPES.has(m._p.type);

function renderMessages(msgs) {
  const comm = [];          // 真实通信消息（主时间线）
  const sysEvents = [];     // 系统事件（折叠区）
  for (const m of msgs) {
    try { m._p = m.payload ? JSON.parse(m.payload) : {}; } catch { m._p = {}; }
    if (!m._p.type || m._p.type === "heartbeat") continue;
    (isCommMsg(m) ? comm : sysEvents).push(m);
  }
  renderSysEvents(sysEvents);

  const groups = new Map();
  const singles = [];
  for (const m of comm) {
    const isTask = m._p.type === "task_request" || m._p.type === "task_result";
    if (isTask && m.correlation_id) {
      if (!groups.has(m.correlation_id)) groups.set(m.correlation_id, { req: null, results: [], lastTs: 0 });
      const g = groups.get(m.correlation_id);
      if (m._p.type === "task_request") g.req = m; else g.results.push(m);
      g.lastTs = Math.max(g.lastTs, m.ts);
    } else {
      singles.push(m);
    }
  }

  const items = [];
  groups.forEach(g => items.push({ kind: "g", ts: g.lastTs, g }));
  for (const m of singles) items.push({ kind: "m", ts: m.ts, m });
  items.sort((a, b) => b.ts - a.ts);

  let html = "";
  for (const it of items) {
    if (it.kind === "m") { html += msgRow(it.m); continue; }
    const { req, results } = it.g;
    if (req) {
      const mark = results.length > 0
        ? `<span class="pill done">✓ 已回传</span> `
        : `<span class="pill wait">… 等待结果</span> `;
      html += msgRow(req, false, mark);
      for (const r of results) html += msgRow(r, true);
    } else {
      for (const r of results) html += msgRow(r);
    }
  }
  document.getElementById("messages").innerHTML = html || '<tr><td colspan="5" class="muted">暂无消息</td></tr>';
}

function sysEventLabel(type) {
  return { register: "上线", offline: "离线", task_progress: "进度", error: "错误" }[type] || type;
}

function renderSysEvents(events) {
  const countEl = document.getElementById("sysEventCount");
  const rowsEl = document.getElementById("sysEventRows");
  if (!countEl || !rowsEl) return;
  // 倒序（最新在前），最多显示 50 条
  const sorted = [...events].sort((a, b) => b.ts - a.ts).slice(0, 50);
  countEl.textContent = `（近 ${events.length} 条）`;
  if (!sorted.length) {
    rowsEl.innerHTML = '<tr><td class="muted">暂无系统事件</td></tr>';
    return;
  }
  rowsEl.innerHTML = sorted.map(m => `
    <tr>
      <td class="muted">${fmt(m.ts)}</td>
      <td style="white-space:nowrap"><span class="pill reg">${esc(sysEventLabel(m._p.type))}</span></td>
      <td>${esc(m.sender_id || "")}</td>
      <td class="preview">${esc(summarize(m))}</td>
    </tr>`).join("");
}

document.getElementById("messages").addEventListener("click", e => {
  const btn = e.target.closest(".exp-btn");
  if (!btn) return;
  const id = Number(btn.dataset.id);
  if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
  const detail = document.getElementById("detail-" + id);
  if (detail) {
    detail.hidden = !expanded.has(id);
    if (detail.hidden) detail.remove();
  }
  btn.textContent = expanded.has(id) ? "收起 ▴" : "展开 ▾";
  if (expanded.has(id) && !document.getElementById("detail-" + id)) refreshMessages();
});

let lastMsgs = [];
async function refreshMessages() {
  if (lastMsgs.length) renderMessages(lastMsgs);
}

const OS_LABEL = { windows: "Windows", linux: "Linux", darwin: "macOS", macos: "macOS" };
const isGui = a => /gui/i.test(a.executor || "");

function agentChip(a) {
  const exe = a.executor || "sdk";
  const tag = isGui(a) ? `<span class="tag gui">GUI</span>`
    : exe.startsWith("interactive_") ? `<span class="tag tui">TUI</span>` : "";
  const exeShort = exe.replace(/^interactive_/, "");
  return `<span class="chip ${a.online ? "" : "offline"}"
    title="${esc(a.agent_id)} · ${esc(exe)}${a.online ? "" : " · 离线"}">
    <span class="dot ${a.online ? "" : "off"}"></span>${esc(a.name)}${tag}
    <span class="edit" data-rename="${esc(a.agent_id)}" title="修改节点名">✎</span>
    <span class="exe">${esc(exeShort)}</span>
    <span class="rm" data-rm="${esc(a.agent_id)}" title="移除节点">×</span></span>`;
}

document.getElementById("agents").addEventListener("click", e => {
  const rm = e.target.closest(".rm");
  if (rm) {
    const id = rm.dataset.rm;
    if (!confirm(`移除节点 ${id}？`)) return;
    busFetch("/api/admin/nodes/" + encodeURIComponent(id), { method: "DELETE" })
      .then(async r => {
        if (r.status === 403) { alert("需要管理员令牌"); return; }
        if (!r.ok) { alert("移除失败: " + (await r.text())); return; }
        const j = await r.json();
        if (!j.broker_restarted) alert("已移除。注意: " + j.broker_message);
        load();
      });
    return;
  }
  const ed = e.target.closest(".edit");
  if (!ed) return;
  const id = ed.dataset.rename;
  const newName = prompt(`修改节点 ${id} 的名称：`, "");
  if (newName === null || !newName.trim()) return;
  busFetch("/api/admin/rename", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ agent_id: id, name: newName.trim() }),
  }).then(async r => {
    if (!r.ok) { alert("改名失败: " + (await r.text())); return; }
    load();
  });
});

async function doSetup() {
  const name = document.getElementById("wizTeamName").value.trim();
  const err = document.getElementById("wizErr");
  err.textContent = "";
  try {
    const r = await fetch("/api/team/setup", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ team_name: name }),
    });
    if (!r.ok) { err.textContent = (await r.json()).detail || "创建失败"; return; }
    document.getElementById("wizard").style.display = "none";
    teamNameCache = name;
    bootAfterWizard();
  } catch (e) { err.textContent = "网络错误"; }
}

let teamNameCache = "";

function renderAgents(agents) {
  // 主控机（运行 bus_server 的机器）置顶；其余按平台+主机名排序
  const hostMap = new Map();
  for (const a of agents) {
    const host = a.hostname || "_unknown";
    if (!hostMap.has(host)) hostMap.set(host, []);
    hostMap.get(host).push(a);
  }
  const keyMaster = a => a.is_master ? 0 : 1;
  const hosts = [...hostMap.entries()].sort((a, b) => {
    const ma = keyMaster(a[1][0]), mb = keyMaster(b[1][0]);
    if (ma !== mb) return ma - mb;  // 主控排最前
    const pa = a[1][0].platform || "zzz", pb = b[1][0].platform || "zzz";
    return pa !== pb ? (pa < pb ? -1 : 1) : (a[0] < b[0] ? -1 : 1);
  });

  let html = "";
  for (const [host, list] of hosts) {
    const plat = list[0].platform || "unknown";
    const osLabel = OS_LABEL[plat] || plat;
    const hostLabel = host === "_unknown" ? "未知主机" : host;
    const isMaster = list.some(a => a.is_master);
    // 该电脑上的 comm node（中间桥梁，exe=comm_node）
    const node = list.find(a => /comm_node/.test(a.executor || ""));
    const nodeBadge = node
      ? `<span class="node-badge ${node.online ? "on" : "off"}">
           <span class="dot ${node.online ? "" : "off"}"></span>
           <span class="node-name">${esc(node.name || node.agent_id)}</span>
           <span class="node-state">${node.online ? "在线" : "离线"}</span>
         </span>`
      : "";
    // 只展示"执行器"（非 comm node），node 已在头部展示
    const agentsOnly = list.filter(a => !/comm_node/.test(a.executor || ""));
    const onlineN = agentsOnly.filter(a => a.online).length;
    html += `<div class="host-group">
      <div class="host-header">
        <span class="os-tag">${esc(osLabel)}</span>
        ${isMaster ? `<span class="master-tag">主控</span>` : ""}
        <span>${esc(hostLabel)}</span>
        ${nodeBadge}
        <span class="host-count">${onlineN}/${agentsOnly.length} 执行器在线</span>
      </div>
      <div class="chips">${agentsOnly.map(agentChip).join("") || '<span class="exe">（无执行器）</span>'}</div>
    </div>`;
  }
  document.getElementById("agents").innerHTML = html || '<div class="exe">暂无注册节点</div>';
}

function busFetch(url, opts) {
  return fetch(url, opts);
}

async function load() {
  try {
    const [agents, msgs, files] = await Promise.all([
      busFetch("/api/agents").then(r => r.json()),
      busFetch("/api/messages?limit=100").then(r => r.json()),
      busFetch("/api/files").then(r => r.json()),
    ]);
    lastMsgs = msgs;
    document.getElementById("conn").classList.remove("off");
    document.getElementById("status").textContent =
      `${agents.filter(a => a.online).length}/${agents.length} 在线 · ${msgs.length} 条消息 · ${files.length} 个文件`;

    const badge = document.getElementById("teamBadge");
    if (teamNameCache) {
      badge.textContent = "队伍 · " + teamNameCache;
      badge.style.display = "inline-block";
    }

    renderAgents(agents);
    renderMessages(msgs);

    document.getElementById("files").innerHTML = files.map(f => `
      <tr><td><a href="${esc(f.url)}" target="_blank">${esc(f.name)}</a></td><td class="muted">${(f.size / 1024).toFixed(1)} KB</td>
      <td>${esc(f.uploaded_by || "-")}</td><td class="muted">${fmt(f.ts)}</td>
      <td class="muted">${esc(f.file_id)}</td></tr>`).join("") || '<tr><td colspan="5" class="muted">暂无文件</td></tr>';
  } catch (e) {
    document.getElementById("conn").classList.add("off");
    document.getElementById("status").textContent = "服务不可达";
  }
}

async function boot() {
  try {
    const r = await fetch("/api/team/status");
    const t = await r.json();
    if (!t.initialized) {
      document.getElementById("wizard").style.display = "flex";
      document.getElementById("status").textContent = "首次运行：创建队伍";
      return;
    }
    teamNameCache = t.team_name;
  } catch (e) { /* 状态查询失败则继续走正常加载 */ }
  bootAfterWizard();
}

function bootAfterWizard() {
  load();
  if (!window._timer) window._timer = setInterval(load, 3000);
}
boot();
</script>
</body>
</html>
