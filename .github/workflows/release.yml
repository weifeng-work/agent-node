# agent-node 自动发布：打 tag → 构建 → OIDC Trusted Publishing 发布到 npm
#
# 触发方式:
#   git tag v0.1.1 && git push --tags
#   或 GitHub → Releases → 选 "v0.1.1" tag → Publish release
#
# 无需任何 npm token —— 用 GitHub OIDC 身份直接与 npm 交换短期凭证（Trusted Publishing）。
# 前提: 需在 npmjs.com 给本包配置 Trusted Publisher，绑定：
#   Owner = weifeng-work / Repository = agent-node / Workflow = release.yml
#
# 注意:
#   - 不要给 actions/setup-node 传 registry-url（会写 .npmrc 的 token 行，与 OIDC 冲突）
#   - 必须声明 permissions.id-token: write 才能交换 OIDC token
#   - npm >= 11.5.1、Node >= 22.14（由 setup-node 提供）
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # 不设 registry-url：避免写入 NODE_AUTH_TOKEN 到 .npmrc，OIDC 会与之冲突

      # 解析当前 tag 版本号，传给发布脚本
      - name: Get tag version
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Release to npm (OIDC)
        run: bash scripts/release.sh "${{ steps.tag.outputs.tag }}"